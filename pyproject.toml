[project]
name = "llm-gateway"
version = "0.1.0"
description = "A measurable, conservative local LLM gateway (foundation milestone)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13.4,<3",
  "uvicorn>=0.52.1,<0.53",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
